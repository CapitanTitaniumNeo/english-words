                    { en: "special effect", bg: "специален ефект", icon: "💥" },
                    { en: "spy", bg: "шпионин", icon: "🕵️" },
                    { en: "star", bg: "звезда", icon: "⭐" },
                    { en: "thriller", bg: "трилър", icon: "🔪" },
                    { en: "viewer", bg: "зрител", icon: "👀" },
                    { en: "winner", bg: "победител", icon: "🥇" },
                    { en: "writer", bg: "сценарист / писател", icon: "✍️" },
                    { en: "zombie", bg: "зомби", icon: "🧟" }
                ]
            }
        };

        let currentUnit = "Starter Unit";
        let db = JSON.parse(localStorage.getItem('english_vocab_progress')) || {};

        function saveProgress() {
            localStorage.setItem('english_vocab_progress', JSON.stringify(db));
            updateOverallProgress();
        }

        function updateOverallProgress() {
            let totalLearned = 0;
            for (const key in db) {
                if (db[key].learned) totalLearned++;
            }
            document.getElementById('progress-count').innerText = totalLearned;
        }

        function playAudio(word, event, btnId) {
            if (event) event.stopPropagation();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-GB';
            window.speechSynthesis.speak(utterance);

            if (!db[word]) db[word] = { listens: 0, flips: 0, learned: false };
            db[word].listens = (db[word].listens || 0) + 1;
            saveProgress();
            
            document.getElementById(`listen-count-${word}`).innerText = db[word].listens;
            checkConditions(word);
        }

        function flipCard(word, cardInner) {
            cardInner.parentElement.classList.toggle('flipped');
            
            if (cardInner.parentElement.classList.contains('flipped')) {
                if (!db[word]) db[word] = { listens: 0, flips: 0, learned: false };
                db[word].flips = (db[word].flips || 0) + 1;
                saveProgress();
                
                document.getElementById(`flip-count-${word}`).innerText = db[word].flips;
                checkConditions(word);
            }
        }

        function checkConditions(word) {
            const data = db[word] || { listens: 0, flips: 0 };
            const listenBadge = document.getElementById(`listen-badge-${word}`);
            const flipBadge = document.getElementById(`flip-badge-${word}`);
            
            if (data.listens >= 10) { listenBadge.classList.replace('bg-gray-200', 'bg-green-200'); listenBadge.classList.replace('text-gray-700', 'text-green-800'); }
            if (data.flips >= 10) { flipBadge.classList.replace('bg-gray-200', 'bg-green-200'); flipBadge.classList.replace('text-gray-700', 'text-green-800'); }
        }

        function setupCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let isDrawing = false;

            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#4F46E5';

            function start(e) {
                isDrawing = true;
                draw(e);
            }
            function stop() {
                isDrawing = false;
                ctx.beginPath();
            }
            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                if (clientX === undefined || clientY === undefined) return;
                
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                ctx.lineTo(x, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y);
            }

            canvas.addEventListener('mousedown', start);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stop);
            canvas.addEventListener('mouseout', stop);

            canvas.addEventListener('touchstart', start, {passive: false});
            canvas.addEventListener('touchmove', draw, {passive: false});
            canvas.addEventListener('touchend', stop);
        }

        function clearCanvas(canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function tryMarkLearned(word) {
            const inputVal = document.getElementById(`input-${word}`).value.trim().toLowerCase();
            const data = db[word] || { listens: 0, flips: 0 };
            const errorMsg = document.getElementById(`error-${word}`);

            if (inputVal !== word.toLowerCase()) {
                errorMsg.innerText = "Грешка в изписването! Опитай пак.";
                errorMsg.classList.remove('hidden');
                document.getElementById(`input-${word}`).classList.add('border-red-500', 'bg-red-50');
                setTimeout(() => document.getElementById(`input-${word}`).classList.remove('border-red-500', 'bg-red-50'), 1500);
                return;
            }
            if (data.listens < 10) {
                errorMsg.innerText = `Слушай думата още ${10 - data.listens} пъти.`;
                errorMsg.classList.remove('hidden');
                return;
            }
            if (data.flips < 10) {
                errorMsg.innerText = `Обърни картата още ${10 - data.flips} пъти.`;
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            data.learned = true;
            saveProgress();
            
            const cardElement = document.getElementById(`card-main-${word}`);
            cardElement.classList.add('border-green-400', 'bg-green-50');
            document.getElementById(`checkbox-${word}`).innerHTML = `<i class="fa-solid fa-check-circle text-4xl text-green-500 drop-shadow-sm"></i>`;
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            Object.keys(wordData).forEach(unit => {
                const btn = document.createElement('button');
                const isSelected = unit === currentUnit;
                btn.className = `whitespace-nowrap px-4 py-2 rounded-lg font-semibold transition-all ${isSelected ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`;
                btn.innerHTML = `${wordData[unit].icon} ${unit}`;
                btn.onclick = () => {
                    currentUnit = unit;
                    renderTabs();
                    renderCards();
                };
                tabsContainer.appendChild(btn);
            });
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            const words = wordData[currentUnit].words;

            words.forEach(item => {
                const w = item.en;
                const data = db[w] || { listens: 0, flips: 0, learned: false };
                const isLearned = data.learned;
                
                const cardHTML = `
                <div id="card-main-${w}" class="bg-white rounded-2xl shadow-lg border-2 ${isLearned ? 'border-green-400 bg-green-50' : 'border-gray-100'} p-4 flex flex-col transition-all">
                    
                    <div class="card card-perspective h-48 w-full cursor-pointer mb-4" onclick="flipCard('${w}', this.children[0])">
                        <div class="card-inner rounded-xl shadow-md border border-gray-200">
                            <div class="card-front bg-indigo-50 flex flex-col items-center justify-center rounded-xl p-4">
                                <h2 class="text-3xl font-bold text-gray-800">${w}</h2>
                                <p class="text-sm text-gray-500 mt-2">Кликни за превод</p>
                            </div>
                            <div class="card-back bg-yellow-50 flex flex-col items-center justify-center rounded-xl p-4">
                                <span class="text-5xl mb-2 drop-shadow-md">${item.icon}</span>
                                <h3 class="text-2xl font-black text-gray-900 text-center uppercase">${item.bg}</h3>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center bg-gray-50 p-2 rounded-lg mb-4">
                        <button onclick="playAudio('${w}', event)" class="bg-blue-500 hover:bg-blue-600 text-white rounded-full w-12 h-12 flex items-center justify-center shadow-md transition-transform active:scale-95">
                            <i class="fa-solid fa-volume-high text-xl"></i>
                        </button>
                        <div class="flex gap-2 text-sm font-semibold">
                            <span id="listen-badge-${w}" class="px-3 py-1 rounded-full ${data.listens >= 10 ? 'bg-green-200 text-green-800' : 'bg-gray-200 text-gray-700'}">
                                <i class="fa-solid fa-headphones"></i> <span id="listen-count-${w}">${data.listens}</span>/10
                            </span>
                            <span id="flip-badge-${w}" class="px-3 py-1 rounded-full ${data.flips >= 10 ? 'bg-green-200 text-green-800' : 'bg-gray-200 text-gray-700'}">
                                <i class="fa-solid fa-arrows-rotate"></i> <span id="flip-count-${w}">${data.flips}</span>/10
                            </span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="flex justify-between mb-1 px-1">
                            <span class="text-xs text-gray-500 font-bold uppercase tracking-wider">Нарисувай думата</span>
                            <button onclick="clearCanvas('canvas-${w}')" class="text-xs text-red-500 hover:text-red-700 font-bold"><i class="fa-solid fa-eraser"></i> Изчисти</button>
                        </div>
                        <canvas id="canvas-${w}" width="400" height="100" class="w-full h-24 bg-[#fafafa] border-2 border-dashed border-gray-300 rounded-lg cursor-crosshair"></canvas>
                    </div>

                    <div class="mt-auto">
                        <p class="text-xs text-gray-500 font-bold uppercase tracking-wider mb-1 px-1">Напиши я правилно</p>
                        <input type="text" id="input-${w}" class="w-full border-2 border-gray-300 rounded-lg p-3 text-lg font-medium text-center focus:outline-none focus:border-indigo-500 mb-2 transition-colors" placeholder="Напиши на английски..." ${isLearned ? 'disabled value="'+w+'"' : ''}>
                        
                        <p id="error-${w}" class="text-red-500 text-sm text-center font-bold mb-3 hidden"></p>
                        
                        <div class="flex justify-center" id="checkbox-${w}">
                            ${isLearned 
                                ? `<i class="fa-solid fa-check-circle text-4xl text-green-500 drop-shadow-sm"></i>` 
                                : `<button onclick="tryMarkLearned('${w}')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-colors">Отбележи като научена</button>`
                            }
                        </div>
                    </div>

                </div>`;
                
                container.innerHTML += cardHTML;
            });

            words.forEach(item => {
                setupCanvas(`canvas-${item.en}`);
            });
        }

        updateOverallProgress();
        renderTabs();
        renderCards();

    </script>
</body>
</html>
